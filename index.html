  <div class="faq">
    <details><summary data-pt="Preciso entender de finanças para usar?" data-en="Do I need to understand finance to use it?"></summary><p data-pt="Não. Cada número vem com uma frase explicando o que significa para a sua carteira — por exemplo: “PETR4 é 20% do seu dinheiro, mas 45% do seu risco”." data-en="No. Every number comes with a sentence explaining what it means for your portfolio — e.g. “PETR4 is 20% of your money but 45% of your risk”."></p></details>
    <details><summary data-pt="É realmente grátis? Qual é a pegadinha?" data-en="Is it really free? What's the catch?"></summary><p data-pt="A quantificação, o Terminal e as Ferramentas são grátis para sempre. A Seven7 ganha dinheiro com os planos pagos das estratégias (sinais de compra e venda), que são opcionais." data-en="Portfolio quant, the Terminal and the Tools are free forever. Seven7 earns from the optional paid strategy plans (buy/sell signals)."></p></details>
    <details><summary data-pt="Vocês acessam minha conta na corretora?" data-en="Do you access my brokerage account?"></summary><p data-pt="Não. Você só digita o código do ativo e o valor. Não pedimos senha, CPF nem conexão com a corretora — dá para testar sem nem criar conta." data-en="No. You only type the ticker and the amount. No password, no ID, no broker connection — you can try it without even signing up."></p></details>
    <details><summary data-pt="Isso é recomendação de investimento?" data-en="Is this investment advice?"></summary><p data-pt="Não. A Seven7 é uma ferramenta de medição: mostra os riscos da carteira que você montou, com base em dados passados. A decisão de comprar ou vender é sempre sua." data-en="No. Seven7 is a measurement tool: it shows the risks of the portfolio you built, based on past data. Buying or selling is always your call."></p></details>
    <details><summary data-pt="De onde vêm os números?" data-en="Where do the numbers come from?"></summary><p data-pt="De 2 anos de preços diários de cada ativo, CDI/Selic/IPCA do Banco Central e câmbio oficial (PTAX). Os métodos são públicos e usados por gestoras: volatilidade, VaR, contribuição ao risco e HRP — as fórmulas aparecem no fim do resultado." data-en="From 2 years of daily prices per asset, CDI/Selic/IPCA from Brazil's central bank and the official FX rate. The methods are public and used by asset managers: volatility, VaR, risk contribution and HRP — formulas are shown at the end of the result."></p></details>
    <details><summary data-pt="Quais ativos posso analisar?" data-en="Which assets can I analyze?"></summary><p data-pt="Ações do Brasil e dos EUA, ETFs, FIIs, as principais criptomoedas e renda fixa (CDI, Selic, IPCA+ e prefixado). Com a conta grátis, você também cadastra ativos fora do catálogo." data-en="Brazilian and US stocks, ETFs, REITs, major crypto and fixed income. With a free account you can also add assets outside the catalog."></p></details>
