<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha mesa — Seven7</title>
<!-- seo -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://seven7invest.com/members.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Seven7">
<meta property="og:title" content="Minha mesa — Seven7">
<meta property="og:description" content="Seven7 — plataforma de quantificação de carteiras.">
<meta property="og:url" content="https://seven7invest.com/members.html">
<meta property="og:image" content="https://seven7invest.com/og.png">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#070b14">
<!-- /seo -->
<link rel="stylesheet" href="styles.css?v=73">
</head>
<body data-page="members">
<div id="nav-root"></div>

<div class="page-hero">
  <div class="kicker" data-i18n="mem.kicker"></div>
  <h1 data-i18n="mem.h1"></h1>
  <p class="sub" data-i18n="mem.sub"></p>
</div>

<div id="memberGate"></div>

<div id="memberContent" hidden>

  <section class="section view-bar-wrap">
    <div id="termCta"></div>
    <div class="view-tabs view-tabs-4" id="deskTabs" role="tablist"></div>
  </section>

  <!-- ===== Portfólio ===== -->
  <div class="view" data-view="portfolio">
    <section class="section">
      <p class="sub view-intro" data-i18n="desk.pfIntro"></p>
      <div id="kmlmHost"></div>
      <div id="portfolioHost"></div>
      <div id="pfQuant" class="q-wrap"></div>
    </section>
  </div>

  <!-- ===== Markov 3 ===== -->
  <div class="view" data-view="markov3" hidden>
    <section class="section">
      <p class="sub view-intro" data-i18n="mem.p1sub"></p>
      <div class="po3-tabrow"><div class="book-tabs" id="po3Tabs"></div></div>
      <div id="po3Panel"></div>
    </section>

    <section class="section section-alt" id="ccMembersSection" hidden>
      <div class="section-head">
        <div class="kicker" data-i18n="mcc.kicker"></div>
        <h2 data-i18n="mcc.h"></h2>
        <p class="sub" data-i18n="mcc.sub"></p>
      </div>
      <div id="ccMembersHost"></div>
    </section>
  </div>

  <!-- ===== Dividendos ===== -->
  <div class="view" data-view="dividends" hidden>
    <section class="section">
      <p class="sub view-intro" data-i18n="mem.p2sub"></p>
      <div class="div-markethead"><div class="book-tabs" id="divMarketTabs"></div><span class="div-tier" id="divTier"></span></div>
      <div id="divTermBar"></div>
      <div class="quant-grid" id="divTiles"></div>
      <div class="chart-card term-card">
        <div class="chart-head term-head">
          <div><div class="chart-title" data-i18n="divterm.mapTitle"></div><div class="chart-sub" data-i18n="divterm.mapHint"></div></div>
          <div class="seg term-mode" id="divHeatMode">
            <button data-m="yoc" class="on" data-i18n="divterm.byYoc"></button>
            <button data-m="yld" data-i18n="divterm.byYld"></button>
          </div>
        </div>
        <div class="term-treemap" id="divHeat"></div>
      </div>
      <div class="mem-subhead" data-i18n="div.sigH"></div>
      <div id="divSignals"></div>
      <div class="desk-2col">
        <div class="chart-card">
          <div class="chart-head"><div class="chart-title" data-i18n="div.salaryTitle"></div></div>
          <div class="chart-body" id="divSalary"></div>
        </div>
        <div class="chart-card">
          <div class="chart-head"><div class="chart-title" data-i18n="divterm.benchTitle"></div></div>
          <div id="divBench" style="padding:12px 6px"></div>
        </div>
      </div>
    </section>
  </div>

  <!-- ===== Vídeos ===== -->
  <div class="view" data-view="videos" hidden>
    <section class="section">
      <p class="sub view-intro" data-i18n="mem.vidSub"></p>
      <div id="memberVideos"></div>
    </section>
  </div>

</div>

<div id="footer-root"></div>
<div class="tooltip" id="tooltip" hidden></div>
<script src="app.js?v=75"></script>
<script src="quant.js?v=2"></script>
</body>
</html>
