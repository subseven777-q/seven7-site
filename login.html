<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Seven7</title>
<link rel="stylesheet" href="styles.css?v=28">
</head>
<body data-page="login">
<div id="nav-root"></div>

<div class="auth-page">
  <div class="auth-card">
    <h1 data-i18n="auth.login.title"></h1>
    <p class="auth-sub" data-i18n="auth.login.sub"></p>
    <form class="auth-form" novalidate>
      <div class="field">
        <label for="li-email" data-i18n="auth.email"></label>
        <input id="li-email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="li-pass" data-i18n="auth.password"></label>
        <input id="li-pass" type="password" autocomplete="current-password" required>
      </div>
      <p class="auth-msg"></p>
      <button class="btn btn-primary btn-block" type="submit" data-i18n="auth.login.submit"></button>
    </form>
    <p class="auth-alt"><span data-i18n="auth.login.no"></span> <a href="register.html" data-i18n="auth.login.signup"></a></p>
  </div>
</div>

<div id="footer-root"></div>
<script src="app.js?v=28"></script>
</body>
</html>
