<body data-page="performance">
<div id="nav-root"></div>

<div class="page-hero">

<section class="section view-bar-wrap">

</section>

<!-- ===== Visão geral ===== -->
<div class="view" data-view="overview">

  <p class="sub view-intro" data-i18n="res.overviewIntro"></p>
  <div class="book-tabs" id="bookTabs"></div>
  <p class="sub track-sub" id="trackSub"></p>
  <div class="stat-row" id="statRow"></div>

  <div class="chart-card">

  <div class="chart-card">

      <div class="chart-title" data-i18n="chart.dd.title"></div>
      <div class="chart-sub" id="ddSub"></div>
    </div>

  </div>
</section>
</div>

<!-- ===== Métricas ===== -->

  <div class="chart-card">

  </div>

</section>

<section class="section" id="hedge">
